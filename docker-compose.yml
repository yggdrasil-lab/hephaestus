services:
  registry:
    image: registry:2
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.registry.rule=Host(`registry.${DOMAIN_NAME}`)"
        - "traefik.http.routers.registry.entrypoints=websecure"
        - "traefik.http.routers.registry.tls=true"
        - "traefik.http.services.registry.loadbalancer.server.port=5000"
        - "traefik.docker.network=aether-net"
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Registry"
      REGISTRY_AUTH_HTPASSWD_PATH: /run/secrets/registry_htpasswd
      REGISTRY_AUTH_ANONYMOUS_ENABLED: "true"
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_STORAGE_CACHE_BLOBDESCRIPTOR: inmemory
    secrets:
      - source: registry_htpasswd
        target: registry_htpasswd
    volumes:
      - /mnt/storage/registry:/var/lib/registry
    networks:
      - aether-net
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  registry-ui:
    image: joxit/docker-registry-ui:2
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 64M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.registry-ui.rule=Host(`registry-ui.${DOMAIN_NAME}`) && Method(`GET`, `HEAD`, `OPTIONS`)"
        - "traefik.http.routers.registry-ui.entrypoints=websecure"
        - "traefik.http.routers.registry-ui.tls=true"
        - "traefik.http.routers.registry-ui.middlewares=authentik@docker"
        - "traefik.http.services.registry-ui.loadbalancer.server.port=80"
        - "traefik.docker.network=aether-net"
    environment:
      - REGISTRY_TITLE=Hephaestus Registry
      - NGINX_PROXY_PASS_URL=http://registry:5000
      - NGINX_RESOLVER=127.0.0.11
      - SINGLE_REGISTRY=true
      - DELETE_IMAGES=false
      - PULL_URL=https://registry.${DOMAIN_NAME}
    networks:
      - aether-net
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  aether-net:
    external: true
  internal:
    driver: overlay
    attachable: true

secrets:
  registry_htpasswd:
    external: true
    name: ${REGISTRY_HTPASSWD_NAME}
